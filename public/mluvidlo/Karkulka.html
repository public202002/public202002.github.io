
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Speech Trainer</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            max-width: 700px;
        }

        textarea {
            width: 100%;
            height: 200px;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input[type=range] {
            width: 100%;
        }

        button {
            padding: 10px 20px;
            margin-top: 20px;
        }

        #currentLine {
            border: 2px solid #333;
            padding: 10px;
            margin-top: 20px;
            font-weight: bold;
            font-size: 1.2em;
            min-height: 40px;
        }

        .form-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }


        .form-row label {
            min-width: 120px;
        }
    </style>
</head>

<body>
    <h2>Speech Trainer</h2>

    <div class="form-row">
        <label>Voice</label>
        <select id="voiceSelect"></select>
    </div>


    <div class="form-row">
        <label>Volume</label>
        <input id="volume" type="range" min="0" max="1" step="0.1" value="1" />
    </div>


    <div class="form-row">
        <label>Pitch</label>
        <input id="pitch" type="range" min="0" max="2" step="0.1" value="1" />
    </div>


    <div class="form-row">
        <label>Rate</label>
        <input id="rate" type="range" min="0.5" max="2" step="0.1" value="1" />
    </div>


    <div class="form-row">
        <label>Pause (ms)</label>
        <input id="pause" type="number" value="500" />
    </div>

    <button id="startBtn">START</button>
    <button id="stopBtn">STOP</button>

    <div id="currentLine"></div>

    <label>Strings to read:</label>
    <textarea id="textInput">Little Red Riding Hood", told in simple English.

Once upon a time, in a village nestled between rolling hills and thick forests, there lived a sweet little girl named Little Red Riding Hood. She got her name from the bright red hooded cloak her grandmother had made for her, which she wore everywhere she went.

One sunny morning, Red Riding Hood’s mother asked her to take a basket of fresh bread, cheese, and honey to her sick grandmother, who lived on the other side of the forest. “Stay on the path,” her mother warned, “and don’t talk to strangers!” Red Riding Hood nodded, kissed her mother goodbye, and skipped off into the woods.

As she walked, she hummed a tune and admired the colorful flowers. But soon, she forgot her mother’s warning and wandered off the path to pick a bouquet. Suddenly, a sly Big Bad Wolf appeared, his eyes gleaming with hunger. “Where are you going, little girl?” he growled.

Red Riding Hood, unaware of the danger, replied, “I’m visiting my grandmother. She lives in a cottage near the old oak tree!” The Wolf grinned, his mind racing with plans. “Why don’t you gather more flowers?” he suggested. “I’ll race you to her house!”

The Wolf darted ahead, running faster than the wind. When he reached the cottage, he tricked the grandmother into hiding in a closet, then dressed in her nightcap and nightgown. He climbed into bed, waiting.

A short while later, Red Riding Hood arrived. “Grandmother, what big eyes you have!” she exclaimed.
“All the better to see you with, my dear,” the Wolf replied in a gruff voice.
“Grandmother, what big ears you have!”
“All the better to hear you with, my dear.”
“Grandmother, what big teeth you have!”
“All the better to… EAT YOU WITH!” the Wolf roared, leaping out of bed!

Just then, a brave woodcutter passing by heard the commotion. He burst into the cottage, brandishing his axe, and chased the Wolf away. Red Riding Hood and her grandmother hugged tightly, relieved.

From that day on, Red Riding Hood never strayed from the path again. And the Wolf? He learned a lesson too—though he never stopped trying to trick others!
Moral of the Story

“Listen to your elders, stay on the safe path, and never trust a wolf in grandmother’s clothing!” 🐺✨

Would you like a happier ending or a modern twist? Let me know! 😊
</textarea>
    <script>
        let lines = [];
        let running = false;

        const textInput = document.getElementById('textInput');
        const volumeEl = document.getElementById('volume');
        const pitchEl = document.getElementById('pitch');
        const rateEl = document.getElementById('rate');
        const pauseEl = document.getElementById('pause');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const currentLineDiv = document.getElementById('currentLine');
        const voiceSelect = document.getElementById('voiceSelect');

        // Populate voices and set default
        function populateVoices() {
            const voices = speechSynthesis.getVoices();
            voiceSelect.innerHTML = '';
            let defaultIndex = 0;
            voices.forEach((voice, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${voice.name} (${voice.lang})`;
                voiceSelect.appendChild(option);
                if (voice.name === 'Google UK English Female' && voice.lang === 'en-GB') {
                    defaultIndex = index;
                }
            });
            voiceSelect.value = defaultIndex;
        }

        populateVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoices;
        }
        // Keep array in sync with textarea
        lines = textInput.value.split('\n');
        textInput.addEventListener('input', () => {
            lines = textInput.value.split('\n');
        });

        // START command
        startBtn.addEventListener('click', async () => {
            if (running) return;
            //lines = textInput.value.split('\n'); // Synchronize lines before starting
            //document.getElementById('stopBtn').style.backgroundColor = 'red';
            running = true;
            await speakLines();
            running = false;
            currentLineDiv.textContent = '';
        });

        // STOP command
        stopBtn.addEventListener('click', () => {
            running = false;
            speechSynthesis.cancel();
            currentLineDiv.textContent = '';
            document.getElementById('startBtn').style.backgroundColor = 'lightgreen';
            document.getElementById('stopBtn').style.backgroundColor = 'yellow';
        });

        async function speakLines() {
            const voices = speechSynthesis.getVoices();
            for (let line of lines) {
                if (!running) return;
                document.getElementById('stopBtn').style.backgroundColor = 'pink';
                document.getElementById('startBtn').style.backgroundColor = 'yellow';
                if (line.trim().length === 0) continue;

                currentLineDiv.textContent = line;

                const utter = new SpeechSynthesisUtterance(line);
                utter.volume = parseFloat(volumeEl.value);
                utter.pitch = parseFloat(pitchEl.value);
                utter.rate = parseFloat(rateEl.value);
                utter.voice = voices[voiceSelect.value];

                speechSynthesis.speak(utter);

                await waitForFinish(utter);
                await delay(parseInt(pauseEl.value));
            }
        }

        function waitForFinish(utter) {
            return new Promise(resolve => {
                utter.onend = resolve;
            });
        }

        function delay(ms) {
            return new Promise(res => setTimeout(res, ms));
        }

        document.getElementById('startBtn').style.backgroundColor = 'lightgreen';

    </script>
    <script src="https://code.responsivevoice.org/responsivevoice.js?key=QGt8YEh3"></script>
</body>

</html>
